[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Tell Netlify's secret scanner to ignore these variable names
[secret-scanning]
  ignore = ["SUPABASE_KEY", "SUPABASE_URL", "RESEND_API_KEY"]

[[redirects]]
  from = "http://yemars.ng/*"
  to = "https://yemars.ng/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.yemars.ng/*"
  to = "https://yemars.ng/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.yemars.ng/*"
  to = "https://yemars.ng/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"